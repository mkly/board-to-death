name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: board_to_death_test
          POSTGRES_USER: board_to_death
          POSTGRES_PASSWORD: board_to_death
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U board_to_death -d board_to_death_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://board_to_death:board_to_death@127.0.0.1:5432/board_to_death?schema=public
      TEST_DATABASE_URL: postgresql://board_to_death:board_to_death@127.0.0.1:5432/board_to_death_test?schema=public
      AUTH_SECRET: quality-gate-auth-secret-at-least-32-characters
      BETTER_AUTH_SECRET: quality-gate-better-auth-secret-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3100
      AUTH_ALLOWED_EMAILS: admin@example.test
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      FILE_STORAGE_PATH: ./.data/files
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the static quality gate
        run: npm run quality:static

  database:
    name: Database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: board_to_death_test
          POSTGRES_USER: board_to_death
          POSTGRES_PASSWORD: board_to_death
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U board_to_death -d board_to_death_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://board_to_death:board_to_death@127.0.0.1:5432/board_to_death?schema=public
      TEST_DATABASE_URL: postgresql://board_to_death:board_to_death@127.0.0.1:5432/board_to_death_test?schema=public
      AUTH_SECRET: quality-gate-auth-secret-at-least-32-characters
      BETTER_AUTH_SECRET: quality-gate-better-auth-secret-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3100
      AUTH_ALLOWED_EMAILS: admin@example.test
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      FILE_STORAGE_PATH: ./.data/files
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the database quality gate
        run: npm run quality:database:node

  browser:
    # The browser suite is the wall-clock cost of this workflow: every spec seeds and wipes the one
    # shared *_test database, so playwright.config.ts pins workers to 1 and the whole thing runs
    # serially against a dev server that compiles routes on demand. Parallelism therefore has to come
    # from separate machines, not separate workers — each shard gets its own Postgres service, so the
    # unscoped fixture wipes stay safe while the suite's runtime is divided by the shard count.
    name: Browser tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: board_to_death_test
          POSTGRES_USER: board_to_death
          POSTGRES_PASSWORD: board_to_death
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U board_to_death -d board_to_death_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://board_to_death:board_to_death@127.0.0.1:5432/board_to_death?schema=public
      TEST_DATABASE_URL: postgresql://board_to_death:board_to_death@127.0.0.1:5432/board_to_death_test?schema=public
      AUTH_SECRET: quality-gate-auth-secret-at-least-32-characters
      BETTER_AUTH_SECRET: quality-gate-better-auth-secret-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3100
      AUTH_ALLOWED_EMAILS: admin@example.test
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      FILE_STORAGE_PATH: ./.data/files
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The service container starts an empty database, so the schema (and the migrations' seeded
      # legacy organization) has to be applied before global setup connects.
      - name: Apply the test database schema
        run: npm run db:test:deploy

      - name: Run the browser suite shard
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Single required status check for the whole gate: branch protection keeps watching "quality"
  # while the work fans out across the jobs above.
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [static, database, browser]
    steps:
      - name: Report the gate result
        run: |
          echo "static:   ${{ needs.static.result }}"
          echo "database: ${{ needs.database.result }}"
          echo "browser:  ${{ needs.browser.result }}"
          test "${{ needs.static.result }}" = success
          test "${{ needs.database.result }}" = success
          test "${{ needs.browser.result }}" = success

  performance:
    name: Performance budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: board_to_death_test
          POSTGRES_USER: board_to_death
          POSTGRES_PASSWORD: board_to_death
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U board_to_death -d board_to_death_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://board_to_death:board_to_death@127.0.0.1:5432/board_to_death?schema=public
      TEST_DATABASE_URL: postgresql://board_to_death:board_to_death@127.0.0.1:5432/board_to_death_test?schema=public
      AUTH_SECRET: quality-gate-auth-secret-at-least-32-characters
      BETTER_AUTH_SECRET: quality-gate-better-auth-secret-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3100
      AUTH_ALLOWED_EMAILS: admin@example.test
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      FILE_STORAGE_PATH: ./.data/files
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Reset the test database
        run: npm run db:test:reset

      - name: Seed the fixed benchmark profile
        run: npm run perf:seed

      # Fails the job when a committed budget in performance/budgets.json regresses.
      - name: Measure server-side budgets
        run: npm run perf:bench

      - name: Measure production-browser route metrics
        run: npx playwright test tests/browser/performance-budgets.spec.ts

      - name: Publish the performance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-run
          path: |
            performance/latest-run.json
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
